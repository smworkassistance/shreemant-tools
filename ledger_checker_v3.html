<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Ledger Checker v3</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f2f5;color:#333;min-height:100vh}

header{background:linear-gradient(135deg,#1a2f5a,#2d4f8a);color:white;padding:1.25rem 2rem;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:1.4rem;font-weight:600}
header p{font-size:.82rem;opacity:.75;margin-top:.2rem}

.container{max-width:1300px;margin:0 auto;padding:1.5rem 2rem}

/* ── Upload ─────────────────────────── */
.upload-zone{border:2px dashed #4a90d9;border-radius:12px;padding:2rem;text-align:center;background:white;cursor:pointer;transition:all .25s;margin-bottom:1rem}
.upload-zone:hover,.upload-zone.drag-over{background:#eef3fc;border-color:#1a2f5a}
.upload-zone input{display:none}
.up-icon{font-size:2.2rem;margin-bottom:.6rem}
.upload-zone h2{color:#1a2f5a;font-size:1.05rem;margin-bottom:.35rem}
.upload-zone p{color:#777;font-size:.84rem}
.hint{font-size:.77rem;color:#aaa;margin-top:.25rem}

/* ── Tab bar ─────────────────────────── */
.tab-bar-wrap{background:white;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:1rem;overflow:hidden}
.tab-bar{display:flex;overflow-x:auto;border-bottom:2px solid #e8ecf0}
.tab-btn{flex-shrink:0;padding:.75rem 1.4rem;border:none;background:transparent;cursor:pointer;font-size:.88rem;font-weight:500;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:#1a2f5a;background:#f7f9fc}
.tab-btn.active{color:#1a2f5a;border-bottom-color:#1a2f5a;font-weight:700}
.tab-btn .rm-tab{display:inline-block;margin-left:.5rem;color:#bbb;font-size:.8rem;line-height:1}
.tab-btn .rm-tab:hover{color:#e74c3c}
.tab-empty{padding:1.5rem 1.5rem;color:#bbb;font-size:.88rem;font-style:italic}

/* ── Stats ───────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:.75rem;margin-bottom:.75rem}
.stat-card{background:white;border-radius:10px;padding:.9rem 1.1rem;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid}
.c-navy{border-color:#1a2f5a}.c-blue{border-color:#4a90d9}.c-green{border-color:#27ae60}
.c-teal{border-color:#16a085}.c-orange{border-color:#e67e22}.c-red{border-color:#e74c3c}.c-gray{border-color:#95a5a6}
.sn{font-size:1.45rem;font-weight:700;line-height:1}
.sl{font-size:.69rem;color:#888;text-transform:uppercase;letter-spacing:.5px;margin:.25rem 0 .15rem}
.sa{font-size:.84rem;font-family:'Courier New',monospace;font-weight:600;color:#444}

/* ── Banners ─────────────────────────── */
.banner-ok{background:linear-gradient(135deg,#1e8449,#27ae60);color:white;border-radius:12px;padding:2.5rem 2rem;text-align:center;margin-bottom:1.25rem;box-shadow:0 4px 15px rgba(39,174,96,.3)}
.banner-ok .ok-icon{font-size:3rem;margin-bottom:.75rem}
.banner-ok h2{font-size:1.8rem;font-weight:700;margin-bottom:.5rem}
.banner-ok p{font-size:.95rem;opacity:.9}
.banner-ok .ok-bal{font-size:1.05rem;font-weight:700;background:rgba(255,255,255,.18);padding:.4rem 1.1rem;border-radius:6px;display:inline-block;margin-top:.75rem}

.banner-mm{background:#fff5f5;border:2px solid #e74c3c;border-radius:10px;padding:.9rem 1.25rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:.75rem}
.banner-mm .mm-icon{font-size:1.5rem;flex-shrink:0}
.banner-mm .mm-text{font-size:.88rem;color:#721c24}
.banner-mm strong{display:block;font-size:.95rem;margin-bottom:.2rem}

/* ── Sections ───────────────────────── */
.section{background:white;border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stitle{font-size:.95rem;font-weight:600;color:#1a2f5a;margin-bottom:1rem;padding-bottom:.6rem;border-bottom:2px solid #eaf0fc;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}

/* ── Side-by-side ───────────────────── */
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:768px){.sbs{grid-template-columns:1fr}}
.half{background:white;border-radius:10px;padding:1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* ── Badges ─────────────────────────── */
.badge{display:inline-block;padding:.18rem .6rem;border-radius:20px;font-size:.72rem;font-weight:700}
.bg{background:#d4edda;color:#155724}.bt{background:#d1f0ea;color:#0e6655}
.bo{background:#fff3cd;color:#856404}.br{background:#f8d7da;color:#721c24}
.bb{background:#d1ecf1;color:#0c5460}.bgr{background:#e9ecef;color:#495057}

/* ── Tables ─────────────────────────── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{background:#f7f8fa;padding:.6rem .75rem;text-align:left;font-size:.71rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #e0e4ea;white-space:nowrap}
td{padding:.6rem .75rem;border-bottom:1px solid #f2f3f5;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfd}
.sub{font-size:.74rem;color:#999;margin-top:.2rem}
.ttl td{background:#f7f8fa!important;font-weight:700;border-top:2px solid #e0e4ea}
.amt{font-family:'Courier New',monospace;font-weight:700}
.acr{color:#1a7f3c}.adr{color:#c0392b}.ane{color:#555}
.ac{text-align:center;color:#27ae60;font-size:1.1rem}
.dpill{display:inline-block;padding:.15rem .5rem;border-radius:20px;font-size:.73rem;font-weight:600;background:#d1ecf1;color:#0c5460;white-space:nowrap}
.cn-chip{display:inline-block;background:#f0e6ff;color:#5d35a0;border-radius:4px;padding:.1rem .4rem;font-size:.74rem;font-weight:600;margin-left:.3rem}
.nodata{text-align:center;padding:1.5rem;color:#bbb;font-style:italic;font-size:.88rem}
.empty-state{text-align:center;padding:3rem 2rem;color:#bbb}
.empty-state .es-icon{font-size:2.5rem;margin-bottom:.75rem}
.empty-state p{font-size:.9rem}

@media print{.upload-zone,.tab-bar-wrap{display:none}.container{padding:0}body{background:white}}
</style>
</head>
<body>
<header>
  <h1>Party Ledger Payment Checker</h1>
  <p>Upload CSV / Excel ledger files — exact match, probable match (CN/adjustment), balance reconciliation</p>
</header>
<div class="container">

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" multiple>
    <div class="up-icon">📂</div>
    <h2>Drop Ledger Files Here</h2>
    <p>Drag &amp; drop CSV or Excel (.xlsx) files, or click to browse</p>
    <p class="hint">Multiple files supported &nbsp;|&nbsp; SAB Tally format</p>
  </div>

  <div class="tab-bar-wrap" id="tabBarWrap" style="display:none">
    <div class="tab-bar" id="tabBar"></div>
  </div>

  <div id="content"></div>
</div>

<script>
// ── CSV parser ────────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    const row = []; let inQ = false, cur = '';
    for (const c of line) {
      if (c === '"') inQ = !inQ;
      else if (c === ',' && !inQ) { row.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    row.push(cur.trim()); rows.push(row);
  }
  return rows;
}

// ── Helpers ───────────────────────────────────────────────────
function parseAmt(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return Math.abs(v);
  return parseFloat(v.toString().replace(/,/g,'').replace(/\s*(Cr|Dr)\s*/gi,'').trim()) || 0;
}
function fmtAmt(n) {
  return '₹' + (n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDate(v) {
  if (!v) return '';
  if (v instanceof Date) return String(v.getDate()).padStart(2,'0')+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+v.getFullYear();
  return v.toString().trim();
}
function daysDiff(d1, d2) {
  try {
    const p = s => { const [d,m,y]=s.split('-').map(Number); return new Date(y,m-1,d); };
    return Math.abs(Math.round((p(d2)-p(d1))/86400000));
  } catch { return '—'; }
}
function esc(s) { return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function str(cell) { return (cell===null||cell===undefined)?'':cell.toString().trim(); }

// ── Ledger parser ─────────────────────────────────────────────
function parseLedger(rows, fallback) {
  let partyName = fallback||'Unknown', period = '';
  let openingBal = 0, openingCr = true;
  let closingBal = null, closingCr = true;

  // Scan ALL cells in ALL rows to find metadata regardless of column position
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    for (let j = 0; j < row.length; j++) {
      const cell = str(row[j]);
      if (!cell) continue;

      // Party name
      if (cell.includes('Account :') || cell.includes('Account:')) {
        const m = cell.match(/Account\s*:\s*(.+)/i);
        if (m) partyName = m[1].trim();
        // Period: next non-empty cell in same row
        for (let k = j+1; k < row.length; k++) {
          const nc = str(row[k]);
          if (nc && !nc.toLowerCase().includes('opening') && !nc.toLowerCase().includes('closing')) {
            period = nc; break;
          }
        }
      }

      // Opening balance
      if (cell.toLowerCase().includes('opening bal')) {
        const m = cell.match(/([\d,]+\.\d+)/);
        if (m) openingBal = parseAmt(m[1]);
        openingCr = !cell.toLowerCase().includes(' dr');
      }

      // Closing balance
      if (cell.toLowerCase().includes('closing bal')) {
        const m = cell.match(/([\d,]+\.\d+)/);
        if (m) { closingBal = parseAmt(m[1]); closingCr = !cell.toLowerCase().includes(' dr'); }
      }
    }
  }

  // Find header row: first row where any cell equals 'Date' (case-insensitive)
  let hdrIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i].some(c => str(c).toLowerCase() === 'date')) { hdrIdx = i; break; }
  }
  if (hdrIdx === -1) return null;

  const hdrs = rows[hdrIdx].map(h => str(h).toLowerCase());
  const col = {
    date   : hdrs.findIndex(h => h==='date'),
    type   : hdrs.findIndex(h => h==='type'),
    vch    : hdrs.findIndex(h => h.includes('vch')||h.includes('bill')),
    account: hdrs.findIndex(h => h==='account'),
    debit  : hdrs.findIndex(h => h.includes('debit')),
    credit : hdrs.findIndex(h => h.includes('credit')&&!h.includes('debit')),
    narr   : hdrs.findIndex(h => h.includes('narr')),
  };
  // Fallback column positions
  if (col.date<0)    col.date=0;
  if (col.type<0)    col.type=1;
  if (col.vch<0)     col.vch=2;
  if (col.account<0) col.account=3;
  if (col.debit<0)   col.debit=4;
  if (col.credit<0)  col.credit=5;

  const entries = [];
  let cur = null;

  for (let i = hdrIdx+1; i < rows.length; i++) {
    const row = rows[i];
    const rowJoined = row.map(c=>str(c)).join('');

    // Stop at Total row or Closing Balance row
    if (rowJoined.toLowerCase().includes('total') ||
        rowJoined.toLowerCase().includes('closing bal')) break;

    const date = fmtDate(row[col.date]);
    const type = str(row[col.type]);

    if (date && type && type.toLowerCase() !== 'type') {
      cur = {
        date, type,
        vch    : str(row[col.vch]),
        account: str(row[col.account]),
        debit  : parseAmt(row[col.debit]),
        credit : parseAmt(row[col.credit]),
        narr   : col.narr>=0 ? str(row[col.narr]) : '',
        lines  : [],
      };
      entries.push(cur);
    } else if (cur) {
      // Continuation row: narration text sits in the Account column (col 3)
      const x = str(row[3]);
      if (x) cur.lines.push(x);
    }
  }

  return { partyName, period, openingBal, openingCr, closingBal, closingCr, entries };
}

// ── Analysis ──────────────────────────────────────────────────
function analyse(meta) {
  const e   = meta.entries;
  const purc = e.filter(x=>x.type==='Purc');
  const pymt = e.filter(x=>x.type==='Pymt');
  const prRt = e.filter(x=>x.type==='PrRt');
  const jrnl = e.filter(x=>x.type==='Jrnl');

  // STEP 1 — Exact matching
  const pymtPool = {};
  pymt.forEach(p => {
    const k = p.debit.toFixed(2);
    (pymtPool[k]=pymtPool[k]||[]).push({...p,_used:false});
  });
  const exactMatched=[], remainPurc=[];
  for (const p of purc) {
    const av = (pymtPool[p.credit.toFixed(2)]||[]).find(x=>!x._used);
    if (av) { av._used=true; exactMatched.push({purchase:p,payment:av,cns:[]}); }
    else     remainPurc.push(p);
  }
  const remainPymt = Object.values(pymtPool).flat().filter(x=>!x._used);

  // STEP 2 — Probable matching (Purchase = Payment + CN(s))
  const cnPool = [
    ...prRt.map((x,i)=>({...x,_cid:`rt${i}`,_used:false})),
    ...jrnl.filter(x=>x.debit>0).map((x,i)=>({...x,_cid:`jn${i}`,_used:false})),
  ];
  const probableMatched=[];
  const usedRP=new Set(), usedRQ=new Set();

  for (let pi=0; pi<remainPurc.length; pi++) {
    if (usedRP.has(pi)) continue;
    const p = remainPurc[pi];
    let found = false;
    for (let qi=0; qi<remainPymt.length&&!found; qi++) {
      if (usedRQ.has(qi)) continue;
      const q = remainPymt[qi];
      if (q.debit>=p.credit) continue;
      const diff = parseFloat((p.credit-q.debit).toFixed(2));
      if (diff<0.01) continue;

      // Single CN
      const ci = cnPool.findIndex(cn=>!cn._used&&Math.abs(cn.debit-diff)<0.005);
      if (ci>=0) {
        cnPool[ci]._used=true; usedRP.add(pi); usedRQ.add(qi);
        probableMatched.push({purchase:p,payment:q,cns:[cnPool[ci]]}); found=true; break;
      }
      // Two CNs
      const av = cnPool.map((cn,i)=>({cn,i})).filter(x=>!x.cn._used);
      outer: for (let a=0;a<av.length;a++) for (let b=a+1;b<av.length;b++) {
        if (Math.abs(av[a].cn.debit+av[b].cn.debit-diff)<0.005) {
          cnPool[av[a].i]._used=true; cnPool[av[b].i]._used=true;
          usedRP.add(pi); usedRQ.add(qi);
          probableMatched.push({purchase:p,payment:q,cns:[av[a].cn,av[b].cn]});
          found=true; break outer;
        }
      }
    }
  }

  const finalPendPurc = remainPurc.filter((_,i)=>!usedRP.has(i));
  const finalPendPymt = remainPymt.filter((_,i)=>!usedRQ.has(i));

  const totalPurc = purc.reduce((s,x)=>s+x.credit,0);
  const totalPymt = pymt.reduce((s,x)=>s+x.debit,0);
  const exactAmt  = exactMatched.reduce((s,m)=>s+m.purchase.credit,0);
  const probAmt   = probableMatched.reduce((s,m)=>s+m.purchase.credit,0);
  const pendAmt   = finalPendPurc.reduce((s,x)=>s+x.credit,0);
  const extraAmt  = finalPendPymt.reduce((s,x)=>s+x.debit,0);
  const isMatched = meta.closingBal!==null && Math.abs(pendAmt-meta.closingBal)<0.01;

  return {purc,pymt,prRt,jrnl,exactMatched,probableMatched,
          finalPendPurc,finalPendPymt,totalPurc,totalPymt,
          exactAmt,probAmt,pendAmt,extraAmt,isMatched};
}

// ── Render a single party ─────────────────────────────────────
function renderParty(lg) {
  const {meta,an} = lg;
  const {exactMatched,probableMatched,finalPendPurc,finalPendPymt,
         totalPurc,totalPymt,exactAmt,probAmt,pendAmt,extraAmt,isMatched} = an;

  // Row 1: balances
  const openBalColor = meta.openingCr ? '#1a7f3c' : '#c0392b';
  const closBalColor = meta.closingCr ? '#1a7f3c' : '#c0392b';
  const row1 = `<div class="stats-row">
    <div class="stat-card c-navy">
      <div class="sl">Opening Balance</div>
      <div class="sn" style="font-size:.92rem">${fmtAmt(meta.openingBal)}</div>
      <div class="sa" style="color:${openBalColor}">${meta.openingCr?'CR — We owe to party':'DR — Party owes us'}</div>
    </div>
    <div class="stat-card c-blue">
      <div class="sn">${an.purc.length}</div>
      <div class="sl">Total Purchases</div>
      <div class="sa">${fmtAmt(totalPurc)}</div>
    </div>
    <div class="stat-card c-gray">
      <div class="sn">${an.pymt.length}</div>
      <div class="sl">Total Payments</div>
      <div class="sa">${fmtAmt(totalPymt)}</div>
    </div>
    <div class="stat-card c-navy">
      <div class="sl">Closing Balance</div>
      <div class="sn" style="font-size:.92rem">${meta.closingBal!==null?fmtAmt(meta.closingBal):'N/A'}</div>
      <div class="sa" style="color:${closBalColor}">${meta.closingCr?'CR — We owe to party':'DR — Party owes us'}</div>
    </div>
  </div>`;

  // Row 2: match stats
  const row2 = `<div class="stats-row">
    <div class="stat-card c-green">
      <div class="sn" style="color:#27ae60">${exactMatched.length}</div>
      <div class="sl">Exact Matched</div>
      <div class="sa">${fmtAmt(exactAmt)}</div>
    </div>
    <div class="stat-card c-teal">
      <div class="sn" style="color:#16a085">${probableMatched.length}</div>
      <div class="sl">Probable Matched</div>
      <div class="sa">${fmtAmt(probAmt)}</div>
    </div>
    <div class="stat-card c-orange">
      <div class="sn" style="color:#e67e22">${finalPendPurc.length}</div>
      <div class="sl">Pending Purchases</div>
      <div class="sa">${fmtAmt(pendAmt)}</div>
    </div>
    <div class="stat-card c-red">
      <div class="sn" style="color:#e74c3c">${finalPendPymt.length}</div>
      <div class="sl">Extra Payments</div>
      <div class="sa">${fmtAmt(extraAmt)}</div>
    </div>
  </div>`;

  // Balance banner
  let balBanner = '';
  if (isMatched) {
    balBanner = `<div class="banner-ok">
      <div class="ok-icon">✅</div>
      <h2>LEDGER MATCHED</h2>
      <p>${esc(meta.partyName)} — all purchases are accounted for</p>
      <div class="ok-bal">Pending Purchases = Closing Balance = ${fmtAmt(meta.closingBal)}</div>
    </div>`;
    return `${row1}${row2}${balBanner}`;
  }

  if (meta.closingBal !== null) {
    const diff = Math.abs(pendAmt - meta.closingBal);
    balBanner = `<div class="banner-mm">
      <div class="mm-icon">⚠️</div>
      <div class="mm-text">
        <strong>Balance Mismatch</strong>
        Pending Purchases: ${fmtAmt(pendAmt)} &nbsp;|&nbsp; Closing Balance: ${fmtAmt(meta.closingBal)} &nbsp;|&nbsp; Difference: ${fmtAmt(diff)}
      </div>
    </div>`;
  }

  // Exact matched table
  const exactSec = exactMatched.length===0 ? '' : `<div class="section">
    <div class="stitle">✅ Exact Matched Pairs
      <span class="badge bg">${exactMatched.length}</span>
      <span class="badge bgr">${fmtAmt(exactAmt)}</span>
    </div>
    <div class="tw"><table>
      <thead><tr>
        <th>Purchase Date</th><th>Purc Vch</th><th>Purchase Amt</th>
        <th></th>
        <th>Payment Date</th><th>Pymt Vch</th><th>Payment Amt</th><th>Gap</th>
      </tr></thead>
      <tbody>
      ${exactMatched.map(m=>{
        const days=daysDiff(m.purchase.date,m.payment.date);
        const narr=m.purchase.lines[0]||m.purchase.narr||'';
        return `<tr>
          <td>${esc(m.purchase.date)}<div class="sub">${esc(narr)}</div></td>
          <td>${esc(m.purchase.vch)}</td>
          <td class="amt acr">${fmtAmt(m.purchase.credit)}</td>
          <td class="ac">→</td>
          <td>${esc(m.payment.date)}</td>
          <td>${esc(m.payment.vch)}</td>
          <td class="amt adr">${fmtAmt(m.payment.debit)}</td>
          <td><span class="dpill">${days} days</span></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>`;

  // Probable matched table
  const probSec = probableMatched.length===0 ? '' : `<div class="section">
    <div class="stitle">🔍 Probable Matches — Purchase = Payment + CN / Adjustment
      <span class="badge bt">${probableMatched.length}</span>
      <span class="badge bgr">${fmtAmt(probAmt)}</span>
    </div>
    <div class="tw"><table>
      <thead><tr>
        <th>Purchase Date</th><th>Purc Vch</th><th>Purchase Amt</th>
        <th>CN / Adjustment</th><th></th>
        <th>Payment Date</th><th>Pymt Vch</th><th>Net Paid</th><th>Gap</th>
      </tr></thead>
      <tbody>
      ${probableMatched.map(m=>{
        const days=daysDiff(m.purchase.date,m.payment.date);
        const narr=m.purchase.lines[0]||m.purchase.narr||'';
        const chips=m.cns.map(cn=>`<span class="cn-chip">${cn.type} ${cn.vch}: ${fmtAmt(cn.debit)}</span>`).join('');
        return `<tr>
          <td>${esc(m.purchase.date)}<div class="sub">${esc(narr)}</div></td>
          <td>${esc(m.purchase.vch)}</td>
          <td class="amt acr">${fmtAmt(m.purchase.credit)}</td>
          <td>${chips}</td>
          <td class="ac">→</td>
          <td>${esc(m.payment.date)}</td>
          <td>${esc(m.payment.vch)}</td>
          <td class="amt adr">${fmtAmt(m.payment.debit)}</td>
          <td><span class="dpill">${days} days</span></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>`;

  // Side-by-side: pending purchases | extra payments
  const pendTbl = finalPendPurc.length===0
    ? '<div class="nodata">✅ No pending purchases</div>'
    : `<div class="tw"><table>
        <thead><tr><th>Date</th><th>Vch</th><th>Amount</th><th>Ref</th></tr></thead>
        <tbody>
        ${finalPendPurc.map(p=>`<tr>
          <td>${esc(p.date)}</td><td>${esc(p.vch)}</td>
          <td class="amt acr">${fmtAmt(p.credit)}</td>
          <td class="sub">${esc(p.lines[0]||p.narr||'')}</td>
        </tr>`).join('')}
        <tr class="ttl"><td colspan="2">Total</td><td class="amt acr">${fmtAmt(pendAmt)}</td><td></td></tr>
        </tbody>
      </table></div>`;

  const extraTbl = finalPendPymt.length===0
    ? '<div class="nodata">✅ No extra payments</div>'
    : `<div class="tw"><table>
        <thead><tr><th>Date</th><th>Vch</th><th>Amount</th><th>Account</th></tr></thead>
        <tbody>
        ${finalPendPymt.map(p=>`<tr>
          <td>${esc(p.date)}</td><td>${esc(p.vch)}</td>
          <td class="amt adr">${fmtAmt(p.debit)}</td>
          <td class="sub">${esc(p.account)}</td>
        </tr>`).join('')}
        <tr class="ttl"><td colspan="2">Total</td><td class="amt adr">${fmtAmt(extraAmt)}</td><td></td></tr>
        </tbody>
      </table></div>`;

  const sbsSec = `<div class="sbs">
    <div class="half">
      <div class="stitle">⏳ Pending Purchases <span class="badge bo">${finalPendPurc.length}</span></div>
      ${pendTbl}
    </div>
    <div class="half">
      <div class="stitle">❓ Extra / Unmatched Payments <span class="badge br">${finalPendPymt.length}</span></div>
      ${extraTbl}
    </div>
  </div>`;

  // Purchase returns section
  let prRtSec = '';
  if (an.prRt.length>0) {
    const prTotal = an.prRt.reduce((s,r)=>s+r.debit,0);
    prRtSec = `<div class="section">
      <div class="stitle">↩️ Purchase Returns / Credit Notes
        <span class="badge bb">${an.prRt.length}</span>
        <span class="badge bgr">${fmtAmt(prTotal)}</span>
      </div>
      <div class="tw"><table>
        <thead><tr><th>Date</th><th>Vch</th><th>Amount</th><th>Narration</th></tr></thead>
        <tbody>
        ${an.prRt.map(r=>`<tr>
          <td>${esc(r.date)}</td><td>${esc(r.vch)}</td>
          <td class="amt ane">${fmtAmt(r.debit)}</td>
          <td class="sub">${esc(r.lines.join(' ')||r.narr||'')}</td>
        </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
  }

  return `${row1}${row2}${balBanner}${exactSec}${probSec}${sbsSec}${prRtSec}`;
}

// ── State + UI ────────────────────────────────────────────────
const parties = [];
let activeIdx = 0;

function selectTab(i) {
  activeIdx = i;
  renderTabs();
  renderContent();
}

function removeParty(i, evt) {
  evt.stopPropagation();
  parties.splice(i, 1);
  if (activeIdx >= parties.length) activeIdx = Math.max(0, parties.length-1);
  render();
}

function renderTabs() {
  const wrap = document.getElementById('tabBarWrap');
  const bar  = document.getElementById('tabBar');
  if (parties.length === 0) { wrap.style.display='none'; return; }
  wrap.style.display='block';
  bar.innerHTML = parties.map((p,i)=>`
    <button class="tab-btn ${i===activeIdx?'active':''}" onclick="selectTab(${i})">
      ${esc(p.meta.partyName)}
      <span class="rm-tab" onclick="removeParty(${i},event)" title="Remove">✕</span>
    </button>`).join('');
}

function renderContent() {
  const div = document.getElementById('content');
  if (parties.length === 0) {
    div.innerHTML = `<div class="empty-state">
      <div class="es-icon">📋</div>
      <p>Upload a ledger file to begin analysis</p>
    </div>`;
    return;
  }
  div.innerHTML = renderParty(parties[activeIdx]);
}

function render() { renderTabs(); renderContent(); }

// ── File loading ──────────────────────────────────────────────
function nameFromFile(f) {
  return f.replace(/\.[^.]+$/,'').replace(/^SAB_AccountLedger_/i,'').trim();
}

async function processFile(file) {
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    const isCSV  = /\.csv$/i.test(file.name);
    if (isCSV) {
      reader.readAsText(file,'utf-8');
      reader.onload = e => resolve(parseCSV(e.target.result));
    } else {
      reader.readAsArrayBuffer(file);
      reader.onload = e => {
        const wb = XLSX.read(e.target.result,{type:'array',cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));
      };
    }
    reader.onerror = reject;
  });
}

async function handleFiles(files) {
  let newAdded = false;
  for (const file of files) {
    if (parties.find(p=>p.filename===file.name)) continue;
    try {
      const rows = await processFile(file);
      const meta = parseLedger(rows, nameFromFile(file.name));
      if (!meta) { alert(`"${file.name}" format not recognised.`); continue; }
      parties.push({filename:file.name, meta, an:analyse(meta)});
      if (!newAdded) { activeIdx = parties.length-1; newAdded=true; }
    } catch(err) {
      console.error(file.name, err);
      alert(`Error loading "${file.name}":\n${err.message}`);
    }
  }
  render();
}

// ── Events ────────────────────────────────────────────────────
const zone  = document.getElementById('uploadZone');
const input = document.getElementById('fileInput');
zone.addEventListener('click',     ()  => input.click());
input.addEventListener('change',   e   => { handleFiles([...e.target.files]); input.value=''; });
zone.addEventListener('dragover',  e   => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', ()  => zone.classList.remove('drag-over'));
zone.addEventListener('drop',      e   => { e.preventDefault(); zone.classList.remove('drag-over'); handleFiles([...e.dataTransfer.files]); });

// Initial render
render();
</script>
